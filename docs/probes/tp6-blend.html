<!doctype html><meta charset="utf-8"><title>T-P6 controlled SMAA blend oracle</title>
<script type="module">
import {WebGLRenderer,WebGLRenderTarget,ShaderMaterial,DataTexture,RGBAFormat,FloatType,NearestFilter,NoBlending,UniformsUtils} from 'three';
import {FullScreenQuad} from 'three/addons/postprocessing/Pass.js';
import {SMAABlendShader} from 'three/addons/shaders/SMAAShader.js';
window.runProbe=async()=>{
 const renderer=new WebGLRenderer({alpha:true,antialias:false});renderer.setSize(3,3);renderer.setPixelRatio(1);
 const target=new WebGLRenderTarget(3,3,{depthBuffer:false});
 const materials=[false,true].map(patched=>{
  const m=new ShaderMaterial({...SMAABlendShader,uniforms:UniformsUtils.clone(SMAABlendShader.uniforms),toneMapped:false,blending:NoBlending});
  if(patched)m.fragmentShader=m.fragmentShader
   .replace('C.xyz = pow(C.xyz, vec3(2.2));','C.xyz = pow(C.xyz / max(C.a, 1e-6), vec3(2.2)) * C.a;')
   .replace('Cop.xyz = pow(Cop.xyz, vec3(2.2));','Cop.xyz = pow(Cop.xyz / max(Cop.a, 1e-6), vec3(2.2)) * Cop.a;')
   .replace('mixed.xyz = pow(mixed.xyz, vec3(1.0 / 2.2));','mixed.xyz = pow(mixed.xyz / max(mixed.a, 1e-6), vec3(1.0 / 2.2)) * mixed.a;');
  m.uniforms.resolution.value.set(1/3,1/3);return m;
 });
 const quad=new FullScreenQuad(materials[0]);
 // Fixtures contain straight encoded RGB, not production output/constants.
 const fixtures=[
  ['white-clear',[1,1,1,1],[0,0,0,0]],
  ['clear-red',[0,0,0,0],[1,0,0,1]],
  ['both-clear',[0,0,0,0],[0,0,0,0]],
  ['opaque-colors',[.2,.4,.8,1],[.9,.1,.3,1]],
  ['opaque-grey',[.5,.5,.5,1],[.5,.5,.5,1]],
  ['partial-colors',[.2,.8,.4,.25],[.9,.1,.7,.75]],
  ['low-alpha',[1,.5,.25,1/255],[.25,.5,1,2/255]],
  ['same-color-alpha',[.3,.6,.9,.2],[.3,.6,.9,.8]],
 ];
 const directions=[['left',2,3],['right',3,5],['up',0,7],['down',1,1]];
 const results=[];
 for(const [name,C,D] of fixtures)for(const [direction,channel,index] of directions)for(const weight of [0,.25,.5,.75]){
  const color=new Float32Array(36),weights=new Float32Array(36);
  for(let i=0;i<9;i++){
   const p=i===index?D:C;
   color.set([p[0]*p[3],p[1]*p[3],p[2]*p[3],p[3]],4*i);weights[4*i+channel]=weight;
  }
  const textures=[color,weights].map(data=>{const t=new DataTexture(data,3,3,RGBAFormat,FloatType);t.minFilter=t.magFilter=NearestFilter;t.needsUpdate=true;return t;});
  const alpha=(1-weight)*C[3]+weight*D[3];
  // Independent scalar oracle: coverage-weighted gamma-light intensities,
  // converted back to encoded RGB and associated with the resulting alpha.
  const expected=[0,1,2].map(c=>alpha===0?0:Math.round(255*alpha*Math.pow(((1-weight)*C[3]*Math.pow(C[c],2.2)+weight*D[3]*Math.pow(D[c],2.2))/alpha,1/2.2)));
  expected.push(Math.round(255*alpha));
  const samples=[];
  for(const material of materials){
   material.uniforms.tColor.value=textures[0];material.uniforms.tDiffuse.value=textures[1];quad.material=material;
   renderer.setRenderTarget(target);quad.render(renderer);
   const pixel=new Uint8Array(4);renderer.readRenderTargetPixels(target,1,1,1,1,pixel);samples.push(Array.from(pixel));
  }
  const error=sample=>Math.max(...sample.map((v,c)=>Math.abs(v-expected[c])));
  results.push({name,direction,weight,expected,original:samples[0],patched:samples[1],originalError:error(samples[0]),patchedError:error(samples[1]),opaque:C[3]===1&&D[3]===1,glError:renderer.getContext().getError()});
  textures.forEach(t=>t.dispose());
 }
 const opaqueMax=Math.max(...results.filter(r=>r.opaque).flatMap(r=>r.patched.map((v,c)=>Math.abs(v-r.original[c]))));
 const positiveMax=Math.max(...results.map(r=>r.patchedError));
 const originalRejected=results.filter(r=>r.originalError>1).length;
 quad.dispose();materials.forEach(m=>m.dispose());target.dispose();renderer.dispose();
 return {purpose:'Controlled pinned SMAA neighborhood blend only; not edge detection or full product acceptance',criterion:'Independent gamma-2.2 coverage oracle <=1 byte/channel; opaque original parity <=1; original non-alpha-aware shader must be rejected',positiveMax,opaqueMax,originalRejected,results,passed:positiveMax<=1&&opaqueMax<=1&&originalRejected>0&&results.every(r=>r.glError===0)};
};
</script>
