<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plinth</title>
    <!-- Empty icon: stops the browser fetching /favicon.ico (a 404 the no-network guard reports). Real favicon is T-P10. -->
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #14161a; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #pick { position: fixed; top: 16px; left: 16px; padding: 10px 16px; cursor: pointer; }
      #note { position: fixed; bottom: 16px; left: 16px; right: 16px; margin: 0; color: white; font: 14px system-ui; }
      #note:not(:empty) { width: fit-content; max-width: calc(100% - 48px); padding: 8px; background: #14161a; }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="Plinth stage"></canvas>
    <button id="pick" type="button" disabled>Choose image</button>
    <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
    <p id="note" role="status" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
