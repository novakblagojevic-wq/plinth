<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="/src/ui/panel.css" />
    <title>Plinth</title>
    <!-- Empty icon: stops the browser fetching /favicon.ico (a 404 the no-network guard reports). Real favicon is T-P10. -->
    <link rel="icon" href="data:," />

  </head>
  <body>
    <main id="workspace"><canvas id="stage" aria-label="Plinth stage"></canvas></main>
    <aside id="panel" aria-label="Podešavanja slike"></aside>
    <button id="settings-open" type="button" aria-expanded="false" aria-controls="panel">Podešavanja</button>
    <button id="pick" type="button" disabled>Choose image</button>
    <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
    <p id="note" role="status" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
