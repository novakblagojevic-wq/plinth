# Deploy from `main` (PLINTH_SPEC §3). Target is GitHub Pages: the one static
# host that can be configured entirely from inside the repo, with no account
# credential the implementing agent does not hold.
#
# TODO(spec): §3 names Cloudflare Pages or Netlify. Both need a dashboard
# connection or an API token outside the repo. Switching later is a P-entry:
# point the provider at `npm run build` / `dist` and delete this file; the
# build uses a relative base so it serves from either.
#
# workflow_dispatch exists so a branch can be pushed to the URL once as a
# renderer smoke test before its PR merges (T-P1 did this).
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
